services:
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
  db:
    image: postgres:16
    environment: {POSTGRES_USER: admin, POSTGRES_PASSWORD: admin, POSTGRES_DB: support}
    ports: ["5432:5432"]
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/init.sql"]
  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      READ_DSN: postgresql://reader:reader@db:5432/support
      FASTEMBED_CACHE_PATH: /cache
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["fastembed:/cache"]
    ports: ["8000:8000"]
    depends_on: [qdrant, db]
volumes:
  fastembed:
